<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="780" viewBox="0 0 1440 780"><rect width="100%" height="100%" fill="#f1f6f9"/><text x="54" y="78" font-family="Segoe UI,Arial,sans-serif" font-size="44" font-weight="700" fill="#17374c">From observation to a durable decision</text><text x="54" y="126" font-family="Segoe UI,Arial,sans-serif" font-size="27" font-weight="400" fill="#526b7c">The transaction is small. The recovery story is explicit.</text><rect x="54" y="190" width="289" height="186" rx="16" fill="white" stroke="white"/><text x="78" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#00838a">1  INPUT</text><text x="78" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Offline quote replay</text><text x="78" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">or daily reference API</text><rect x="400" y="190" width="289" height="186" rx="16" fill="white" stroke="white"/><text x="424" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#00838a">2  VALIDATE</text><text x="424" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Decimal + UTC fields</text><text x="424" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Pair, source, freshness</text><rect x="746" y="190" width="289" height="186" rx="16" fill="white" stroke="white"/><text x="770" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#00838a">3  TRANSACT</text><text x="770" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Quote + rule decision</text><text x="770" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">State + alert outbox</text><rect x="1092" y="190" width="289" height="186" rx="16" fill="white" stroke="white"/><text x="1116" y="240" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#00838a">4  DISPATCH</text><text x="1116" y="295" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Stable event ID</text><text x="1116" y="334" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#17374c">Local journal + ack</text><polyline points="350,280 391,280" fill="none" stroke="#00838a" stroke-width="4"/><polyline points="381,272 391,280 381,288" fill="none" stroke="#00838a" stroke-width="4"/><polyline points="696,280 737,280" fill="none" stroke="#00838a" stroke-width="4"/><polyline points="727,272 737,280 727,288" fill="none" stroke="#00838a" stroke-width="4"/><polyline points="1042,280 1083,280" fill="none" stroke="#00838a" stroke-width="4"/><polyline points="1073,272 1083,280 1073,288" fill="none" stroke="#00838a" stroke-width="4"/><rect x="54" y="434" width="880" height="270" rx="16" fill="#112e43" stroke="#112e43"/><text x="82" y="488" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700" fill="white">SQLite stores the explanation</text><text x="82" y="540" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#cbe2ec">96 rule decisions = 68 condition misses + 13 cooldowns + 15 alerts</text><text x="82" y="593" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#cbe2ec">An interrupted transaction commits all four records or none.</text><text x="82" y="643" font-family="Segoe UI,Arial,sans-serif" font-size="24" font-weight="400" fill="#cbe2ec">A delivery retry reuses its event ID instead of adding a new receipt.</text><rect x="966" y="434" width="415" height="270" rx="16" fill="white" stroke="white"/><text x="993" y="488" font-family="Segoe UI,Arial,sans-serif" font-size="28" font-weight="700" fill="#00838a">INSPECT</text><text x="993" y="543" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#17374c">Static HTML / SVG report</text><text x="993" y="591" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#17374c">Read-only localhost API</text><text x="993" y="639" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="400" fill="#17374c">History and alert status</text><text x="54" y="756" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="400" fill="#526b7c">Architecture of the maintained implementation · scenario counts come from docs/evidence/replay-results.json</text></svg>