[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-rate-prompter"
version = "1.0.0"
description = "Replayable exchange-rate monitoring with durable, testable alerts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jirapas Wongtreenatrkoon"}]
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
currency-prompter = "currency_prompter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
currency_prompter = ["data/*.json"]
