[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "currency-rate-prompter"
version = "1.2.0"
description = "Replayable exchange-rate monitoring with durable, testable alerts"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Jirapas Wongtreenatrkoon"}]
license = {file = "LICENSE"}
dependencies = []

[project.scripts]
currency-prompter = "currency_prompter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
currency_prompter = ["data/*.json", "static/*.html", "static/*.css", "static/*.js"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.coverage.run]
branch = true
source_pkgs = ["currency_prompter"]
relative_files = true
parallel = true
patch = ["subprocess"]

[tool.coverage.paths]
package = ["src/currency_prompter", "*/site-packages/currency_prompter"]

[tool.coverage.report]
# Local installed-package suite measured 92.51% combined statements and branches.
fail_under = 90
precision = 2
show_missing = true
exclude_lines = []
partial_branches = []
